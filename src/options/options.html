<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>语音问卷助手 · 设置</title>
  <style>
    body { font: 14px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #18231f;
           max-width: 640px; margin: 32px auto; padding: 0 20px; }
    h1 { font-size: 20px; } h2 { font-size: 15px; margin-top: 28px; border-bottom: 1px solid #e5e0d5; padding-bottom: 6px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    small { color: #6a746d; font-weight: 400; }
    input[type=text], input[type=password], input[type=number] { width: 100%; padding: 8px 10px; margin-top: 4px;
      border: 1px solid #c8c0b1; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    button { border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 700; cursor: pointer; }
    .primary { background: #166b5b; color: #fff; }
    .ghost { background: #ede9df; color: #455149; }
    #msg { margin-left: 10px; }
    .ok { color: #166b5b; } .err { color: #ad5b35; }
    select { padding: 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>语音问卷助手 · 设置</h1>

  <h2>LLM（BYOK，可选增强）</h2>
  <p><small>填入任意 OpenAI 兼容或 Anthropic 兼容服务（OpenAI / DeepSeek / Moonshot / Ollama / Dots…）。不填则使用内置规则匹配，基础功能不受影响。</small></p>
  <div class="row">
    <label style="margin:0">接口协议
      <select id="protocol">
        <option value="openai">OpenAI 兼容（/v1/chat/completions）</option>
        <option value="anthropic">Anthropic 兼容（/v1/messages）</option>
      </select>
    </label>
    <label style="margin:0">鉴权方式
      <select id="authStyle">
        <option value="auto">自动（按协议默认）</option>
        <option value="bearer">Authorization: Bearer</option>
        <option value="api-key">api-key 头</option>
        <option value="x-api-key">x-api-key 头</option>
      </select>
    </label>
  </div>
  <label>Base URL <small>（如 https://api.deepseek.com/v1；填域名根也可，自动补 /v1）</small>
    <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1">
  </label>
  <label>API Key
    <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
  </label>
  <label>模型名 <small>（如 gpt-4o-mini / deepseek-chat / claude-sonnet-4-5）</small>
    <input type="text" id="model" placeholder="gpt-4o-mini">
  </label>
  <div class="row"><input type="checkbox" id="llmPrivate"><label for="llmPrivate" style="margin:0;font-weight:400">允许本地/内网地址 <small>（自建模型如 Ollama http://localhost:11434；默认关闭）</small></label></div>
  <div class="row">
    <button class="ghost" id="test">测试连通性</button>
    <span id="msg"></span>
  </div>

  <h2>语音识别方式（ASR）</h2>
  <div class="row">
    <label style="margin:0">识别引擎
      <select id="asrMode">
        <option value="auto">自动（按页面环境选择，推荐）</option>
        <option value="webspeech">浏览器内置（Web Speech，零配置）</option>
        <option value="api">自备转写服务（OpenAI 兼容 /v1/audio/transcriptions）</option>
        <option value="llm-multimodal">LLM 多模态直转写（复用上方 LLM 配置）</option>
      </select>
    </label>
    <label style="margin:0" id="preferBox">自动优先级
      <select id="asrPrefer">
        <option value="browser-first">浏览器优先（https 用内置，http 用自有服务）</option>
        <option value="service-first">自有服务优先（配置了转写服务时）</option>
      </select>
    </label>
  </div>
  <div id="asrApiBox">
    <label>转写 Base URL <small>（如 https://api.openai.com/v1）</small>
      <input type="text" id="asrBaseUrl" placeholder="https://api.openai.com/v1">
    </label>
    <label>转写 API Key
      <input type="password" id="asrApiKey" placeholder="sk-..." autocomplete="off">
    </label>
    <label>转写模型名 <small>（如 whisper-1）</small>
      <input type="text" id="asrModel" placeholder="whisper-1">
    </label>
    <div class="row"><input type="checkbox" id="asrPrivate"><label for="asrPrivate" style="margin:0;font-weight:400">允许本地/内网地址 <small>（内网部署的转写服务；默认关闭）</small></label></div>
  </div>
  <p><small>自动模式：https 页面优先浏览器内置识别；http 页面（浏览器不允许页面访问麦克风）自动改用扩展自己的识别链，失败逐级降级。录音频块（约 5 秒）由插件直连你配置的服务转写，本插件不经手中转。</small></p>

  <h2>语音交互</h2>
  <div class="row"><label>识别语言
    <select id="lang">
      <option value="zh-CN">中文（普通话）</option>
      <option value="zh-HK">中文（粤语）</option>
      <option value="en-US">English (US)</option>
    </select>
  </label></div>
  <div class="row"><label>朗读语速 <input type="number" id="rate" min="0.5" max="2" step="0.1" style="width:70px"></label></div>
  <div class="row"><input type="checkbox" id="readOptions"><label for="readOptions" style="margin:0">朗读题目时同时朗读选项</label></div>
  <div class="row"><input type="checkbox" id="autoSingle"><label for="autoSingle" style="margin:0">单选/量表说完自动进入下一题</label></div>
  <div class="row"><input type="checkbox" id="autoMulti"><label for="autoMulti" style="margin:0">多选说完自动进入下一题（关闭则需说"完成"）</label></div>

  <h2>论述题</h2>
  <div class="row"><input type="checkbox" id="autoClean"><label for="autoClean" style="margin:0">说完后请求 LLM 整理成书面语（整理结果先预览、可编辑、可改用原文）</label></div>

  <div class="row" style="margin-top:24px">
    <button class="primary" id="save">保存设置</button>
    <span id="saveMsg"></span>
  </div>

  <script src="../shared/settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
